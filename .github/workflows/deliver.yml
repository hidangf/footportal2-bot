name: Footportal2 Telegram delivery
on:
  push:
    branches: [main]
    paths:
      - 'queue/*.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without posting'
        type: boolean
        required: true
        default: true
permissions:
  contents: write
concurrency:
  group: footportal2-telegram
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate or publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python deliver.py --dry-run
          else
            python deliver.py
          fi
      - name: Save publication history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sent.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update delivery history [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
